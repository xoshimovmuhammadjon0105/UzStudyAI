<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UzStudy AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101116;color:#f5f5f7;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;overflow:hidden
}
button{cursor:pointer;font-family:inherit}
.sidebar{
 width:260px;background:#171820;padding:20px;
 display:flex;flex-direction:column;border-right:1px solid #292a33
}
.logo{font-size:25px;font-weight:bold;margin-bottom:28px}
.logo span{color:#9585ff}
.newchat{
 background:#292a36;border:1px solid #414252;
 padding:13px;border-radius:12px;color:white;text-align:left
}
.history-title{color:#888;font-size:12px;margin:28px 5px 12px}
.history-list{overflow:auto}
.history-item{
 padding:11px;border-radius:9px;color:#bbb;
 cursor:pointer;font-size:13px;overflow:hidden;
 white-space:nowrap;text-overflow:ellipsis
}
.history-item:hover{background:#292a36}
.side-bottom{margin-top:auto;color:#777;font-size:12px;line-height:1.8}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
 height:65px;border-bottom:1px solid #292a33;
 display:flex;align-items:center;padding:0 25px;
 font-size:17px;justify-content:space-between
}
.online{font-size:12px;color:#70d6a1}
.chat{flex:1;overflow-y:auto;padding:25px 15px}
.welcome{text-align:center;margin:12vh auto;max-width:650px}
.welcome .star{font-size:38px}
.welcome h1{font-size:34px;margin:15px 0}
.welcome p{color:#999;line-height:1.7}
.suggestions{
 display:flex;gap:10px;flex-wrap:wrap;
 justify-content:center;margin-top:25px
}
.suggestions button{
 background:#20212b;color:#ddd;border:1px solid #383a48;
 padding:12px 15px;border-radius:12px
}
.messages{max-width:820px;margin:auto}
.message{
 padding:15px 18px;margin:18px 0;
 line-height:1.7;white-space:pre-wrap;
 overflow-wrap:anywhere;border-radius:17px
}
.user{
 background:#292b38;margin-left:auto;
 max-width:85%;width:fit-content
}
.bot{background:#1b1d27;border:1px solid #30323e}
.message img{
 display:block;max-width:100%;max-height:480px;
 border-radius:13px;margin-top:12px
}
.message a{color:#a99cff}
.composer-area{padding:15px 18px 20px}
.composer{
 max-width:820px;margin:auto;background:#20212b;
 border:1px solid #414351;border-radius:20px;
 padding:10px;display:flex;align-items:flex-end;gap:8px
}
textarea{
 flex:1;resize:none;max-height:140px;min-height:40px;
 background:transparent;color:white;border:0;
 outline:0;font:15px Arial;padding:11px
}
.tool{
 background:#30313e;color:white;border:0;
 border-radius:11px;padding:11px;font-size:18px
}
.tool:hover,.newchat:hover{background:#3a3b4a}
.send{
 background:#9585ff;color:white;border:0;
 border-radius:12px;padding:12px 17px;font-size:18px
}
.send:hover{background:#7f6bed}
.hint{text-align:center;color:#777;font-size:11px;margin-top:10px}
#preview{max-width:820px;margin:0 auto 8px}
#preview img{height:75px;border-radius:10px}
.preview-wrap{display:inline-block;position:relative}
.remove-preview{
 position:absolute;top:-7px;right:-7px;
 border:0;border-radius:50%;background:#e44;
 color:white;width:22px;height:22px
}
.typing{color:#aaa;font-size:13px}
@media(max-width:700px){
 .sidebar{display:none}
 .welcome h1{font-size:25px}
 .top{padding:0 15px}
 .composer-area{padding:10px}
 .chat{padding:15px 10px}
 .tool{padding:10px}
}
</style>
</head>

<body>

<aside class="sidebar">
 <div class="logo">✦ UzStudy <span>AI</span></div>
 <button class="newchat" onclick="newChat()">＋ Yangi suhbat</button>
 <div class="history-title">SO‘NGGI SUHBATLAR</div>
 <div class="history-list" id="historyList"></div>
 <div class="side-bottom">
  UzStudy AI · Beta<br>
  O‘rganishning yangi usuli ✨
 </div>
</aside>

<main class="main">
 <div class="top">
  <div>UzStudy AI <span style="color:#888;font-size:12px">Beta</span></div>
  <div class="online">● Online</div>
 </div>

 <div class="chat" id="chat">
  <div class="welcome" id="welcome">
   <div class="star">✦</div>
   <h1>Bugun nimani o‘rganamiz?</h1>
   <p>Istalgan savolingizni bering. Yangi g‘oyalar, bilimlar va ijodiy imkoniyatlar shu yerdan boshlanadi.</p>
   <div class="suggestions">
    <button onclick="suggest('Koinot haqida qiziqarli ma’lumot ber')">🌌 Koinot</button>
    <button onclick="suggest('HTML dasturlashni o‘rgat')">💻 Dasturlash</button>
    <button onclick="suggest('Sun’iy intellekt qanday ishlaydi?')">🤖 AI</button>
   </div>
  </div>
  <div class="messages" id="messages"></div>
 </div>

 <div class="composer-area">
  <div id="preview"></div>
  <div class="composer">
   <input type="file" id="imageInput"
    accept="image/png,image/jpeg,image/webp" hidden>
   <button class="tool" onclick="imageInput.click()" title="Rasm tanlash">📎</button>
   <button class="tool" onclick="generateImage()" title="Rasm yaratish">🎨</button>
   <textarea id="question" placeholder="UzStudy AI'dan so‘rang..." rows="1"></textarea>
   <button class="send" onclick="sendMessage()">↑</button>
  </div>
  <div class="hint">UzStudy AI xato qilishi mumkin. Muhim ma’lumotlarni tekshiring.</div>
 </div>
</main>

<script>
const question=document.getElementById("question");
const messages=document.getElementById("messages");
const welcome=document.getElementById("welcome");
const imageInput=document.getElementById("imageInput");
const preview=document.getElementById("preview");
const chat=document.getElementById("chat");
const historyList=document.getElementById("historyList");

let history=[];
let selectedImage=null;
let conversations=JSON.parse(localStorage.getItem("uzstudy_chats")||"[]");

function saveConversations(){
 localStorage.setItem("uzstudy_chats",JSON.stringify(conversations));
 renderHistory();
}

function renderHistory(){
 historyList.innerHTML="";
 conversations.slice().reverse().forEach((item,index)=>{
  const btn=document.createElement("div");
  btn.className="history-item";
  btn.textContent=item.title;
  btn.onclick=()=>loadConversation(conversations.length-1-index);
  historyList.appendChild(btn);
 });
}

function saveCurrentConversation(){
 if(history.length===0)return;
 const title=history.find(x=>x.role==="user")?.content||"Yangi suhbat";
 const item={
  title:title.slice(0,35),
  messages:history.slice()
 };
 conversations.push(item);
 conversations=conversations.slice(-30);
 saveConversations();
}

function loadConversation(index){
 const item=conversations[index];
 if(!item)return;
 history=item.messages.slice();
 messages.innerHTML="";
 welcome.style.display="none";
 history.forEach(m=>addMessage(m.role,m.content));
}

function addMessage(role,text,image){
 const div=document.createElement("div");
 div.className="message "+(role==="user"?"user":"bot");
 const content=document.createElement("div");
 content.textContent=text;
 div.appendChild(content);

 if(image){
  const img=document.createElement("img");
  img.src=image;
  img.alt="AI yaratgan rasm";
  div.appendChild(img);
 }

 messages.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

function newChat(){
 if(history.length)saveCurrentConversation();
 history=[];
 messages.innerHTML="";
 selectedImage=null;
 preview.innerHTML="";
 question.value="";
 imageInput.value="";
 welcome.style.display="block";
}

function suggest(text){
 question.value=text;
 sendMessage();
}

imageInput.addEventListener("change",()=>{
 const file=imageInput.files[0];
 if(!file)return;

 if(file.size>5*1024*1024){
  alert("Rasm 5 MB dan kichik bo‘lsin.");
  imageInput.value="";
  return;
 }

 if(!["image/png","image/jpeg","image/webp"].includes(file.type)){
  alert("PNG, JPG yoki WEBP rasm tanlang.");
  imageInput.value="";
  return;
 }

 const reader=new FileReader();
 reader.onload=()=>{
  selectedImage=reader.result;
  preview.innerHTML="";
  const wrap=document.createElement("div");
  wrap.className="preview-wrap";
  const img=document.createElement("img");
  img.src=selectedImage;
  const remove=document.createElement("button");
  remove.className="remove-preview";
  remove.textContent="×";
  remove.onclick=()=>{
   selectedImage=null;
   preview.innerHTML="";
   imageInput.value="";
  };
  wrap.append(img,remove);
  preview.appendChild(wrap);
 };
 reader.readAsDataURL(file);
});

async function sendMessage(){
 const text=question.value.trim();
 if(!text&&!selectedImage)return;

 welcome.style.display="none";
 addMessage("user",text||"Rasm tanlandi",selectedImage);

 const image=selectedImage;
 question.value="";
 selectedImage=null;
 preview.innerHTML="";
 imageInput.value="";

 // Eslatma: hozirgi server.js rasm tahlilini qo‘llamaydi.
 if(image){
  addMessage("assistant",
   "Rasmingiz qabul qilindi. Hozircha rasmni AI orqali tahlil qilish serverga ulanmagan. Bu imkoniyatni keyingi bosqichda qo‘shamiz.");
  return;
 }

 await askAI(text);
}

async function askAI(text){
 const loading=addMessage("assistant","UzStudy AI o‘ylayapti... ✨");

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message:text,
    history:history
   })
  });

  const data=await response.json();
  loading.remove();

  if(!response.ok)throw new Error(data.error||"Xatolik yuz berdi");

  const reply=data.reply||"Javob olinmadi.";
  addMessage("assistant",reply);

  history.push({role:"user",content:text});
  history.push({role:"assistant",content:reply});
  history=history.slice(-12);

 }catch(error){
  loading.remove();
  addMessage("assistant","Xatolik: "+error.message);
 }
}

async function generateImage(){
 const prompt=question.value.trim();

 if(!prompt){
  question.placeholder="Qanday rasm yaratishni yozing...";
  question.focus();
  return;
 }

 welcome.style.display="none";
 addMessage("user","🎨 Rasm yaratish: "+prompt);
 question.value="";

 const loading=addMessage("assistant","🎨 Rasm yaratilmoqda. Navbatga qarab biroz kuting...");

 try{
  const response=await fetch("/api/image",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt})
  });

  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Rasm so‘rovi bajarilmadi");

  let result;

  do{
   await new Promise(resolve=>setTimeout(resolve,5000));

   const check=await fetch("/api/image/"+encodeURIComponent(data.jobId));
   result=await check.json();

   if(!check.ok)throw new Error(result.error||"Rasmni tekshirishda xatolik");

  }while(!result.done);

  loading.remove();

  if(!result.image)throw new Error("Rasm topilmadi");

  addMessage("assistant","Mana, siz so‘ragan rasm! ✨",result.image);

 }catch(error){
  loading.remove();
  addMessage("assistant","Rasm yaratishda xatolik: "+error.message);
 }
}

question.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
});

renderHistory();
</script>
</body>
</html>
